<script>
  // Simple interactivity for checkboxes and styling
  document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
    checkbox.addEventListener('change', (e) => {
      const labelText = e.target.closest('label').querySelector('span.font-semibold');
      if (e.target.checked) {
        labelText.classList.add('opacity-40', 'line-through');
      } else {
        labelText.classList.remove('opacity-40', 'line-through');
      }
    });
  });

  // Auto-populate patient information from localStorage
  document.addEventListener('DOMContentLoaded', function() {
    try {
      const patientData = localStorage.getItem('currentPatient');
      if (patientData) {
        const patient = JSON.parse(patientData);
        
        // Find all text inputs in the Identity section
        const section = document.querySelector('section');
        if (section) {
          const inputs = section.querySelectorAll('input[type="text"]');
          
          if (inputs.length >= 1) {
            // First input: Volan'ny olona manana sonia (Name with signature)
            inputs[0].value = patient.name || '';
          }
          
          // You can add more field mappings here if needed
          // inputs[1].value = patient.relationship || '';
        }
        
        console.log('Patient info loaded:', patient);
      }
    } catch (error) {
      console.error('Error loading patient data:', error);
    }
  });
</script>
